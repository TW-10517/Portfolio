<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Builder</title>
    <meta name="description" content="Build, preview, and share your personal portfolio — no code required." />

    <!-- Link-preview metadata for the app itself. A *shared portfolio* gets
         its own tags from the API server's /p/:slug route (server/preview.js)
         rather than from here — the crawlers don't run JavaScript, and a
         static host can't vary these per slug. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portfolio Builder" />
    <meta property="og:title" content="Portfolio Builder" />
    <meta property="og:description" content="Build, preview, and share your personal portfolio — no code required." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portfolio Builder" />
    <meta name="twitter:description" content="Build, preview, and share your personal portfolio — no code required." />
    <!-- The font stylesheet is injected by useTheme once the theme is known,
         which means the DNS lookup and TLS handshake for it start late and on
         the critical path. Opening the connections up front costs nothing and
         removes that setup from the wait. crossorigin is required on the
         gstatic hint: font files are fetched anonymously, and a hint whose
         mode doesn't match the request opens a second connection instead. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
