name: CI

on:
  push:
    branches: [main, video]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The suites run against an in-memory database so CI never touches a
      # checked-in SQLite file.
      DATABASE_URL: ":memory:"
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: better-sqlite3 13 declares engines >= 22, and CI on 20 fell
      # over at the first import. Local development runs 24, so anything below
      # 22 was only ever going to be tested here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 ships prebuilt binaries for current Node LTS on Linux,
      # so this needs no system toolchain.
      - run: npm ci

      - name: Unit, component and integration tests
        run: npm test
        env:
          JWT_SECRET: ci-only-secret-not-used-in-production

      # The same suites again, against real PostgreSQL (PGlite compiles it to
      # WASM, so there is no service to stand up). Without this the Postgres
      # path is code nobody runs until someone deploys on it.
      - name: Server tests against PostgreSQL
        run: npm run test:pg
        env:
          JWT_SECRET: ci-only-secret-not-used-in-production

      - name: Production build
        run: npm run build

      # The server refuses to boot in production without a real JWT_SECRET.
      # Asserting it here means the guard can't be dropped unnoticed.
      - name: Reject an insecure production secret
        env:
          NODE_ENV: production
          JWT_SECRET: dev-only-insecure-secret-change-in-production
        run: |
          if node -e "import('./server/app.js')" 2>/dev/null; then
            echo "::error::Server booted in production with the insecure dev secret"
            exit 1
          fi
          echo "Guard held."

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium is configured as a project, so pulling the other two
      # engines would add minutes of download for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts both servers itself on isolated ports
      # (4001/5174) against server/e2e.sqlite, so nothing here needs to boot
      # or clean up a server by hand.
      - name: Browser end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploys only from the default branch, only after everything above passed,
  # and only if the corresponding secret exists. A repository with no secrets
  # set skips every step here rather than failing — which is what makes it safe
  # to commit before there is anywhere to deploy to.
  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Lifted into env because GitHub does not expose the `secrets` context to a
    # step's `if:` — only github, needs, vars, env and a few others. Testing
    # `secrets.X != ''` there silently never matches, so the deploy would look
    # like it ran and skip every step.
    env:
      API_DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}
      FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built here rather than on the host: the frontend bakes VITE_API_URL in
      # at build time, so it has to come from somewhere that knows it.
      - name: Build the frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Kept for 30 days so a bad deploy can be rolled back to an exact
      # artifact rather than to "whatever main looked like".
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          retention-days: 30

      # A deploy hook is a plain URL the host gives you, so this works for
      # Render, Deno Deploy, Cloudflare and others without an SDK or a
      # provider-specific action.
      - name: Deploy the API
        if: ${{ env.API_DEPLOY_HOOK_URL != '' }}
        run: |
          code=$(curl -sS -X POST -o /tmp/out.txt -w '%{http_code}' "$HOOK")
          echo "host replied $code"
          cat /tmp/out.txt
          # A hook that answers 4xx/5xx has not deployed anything, and a green
          # tick on a failed deploy is worse than a red one.
          [ "$code" -lt 400 ] || exit 1
        env:
          HOOK: ${{ env.API_DEPLOY_HOOK_URL }}

      - name: Deploy the frontend
        if: ${{ env.FRONTEND_DEPLOY_HOOK_URL != '' }}
        run: |
          code=$(curl -sS -X POST -o /tmp/out.txt -w '%{http_code}' "$HOOK")
          echo "host replied $code"
          cat /tmp/out.txt
          [ "$code" -lt 400 ] || exit 1
        env:
          HOOK: ${{ env.FRONTEND_DEPLOY_HOOK_URL }}

      # Proves the thing that is now running is the thing that just passed.
      # Without it, "deployed" only means the host accepted a request.
      - name: Wait for the API to come back healthy
        if: ${{ vars.HEALTH_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$HEALTH" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s):"; cat /tmp/health.json; exit 0
            fi
            echo "attempt ${i}: $code"; sleep 10
          done
          echo "::error::API did not report healthy within five minutes"
          exit 1
        env:
          HEALTH: ${{ vars.HEALTH_URL }}
